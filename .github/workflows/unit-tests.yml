name: Dashboard CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm exec next typegen && pnpm exec tsc --noEmit
      - run: pnpm test
      - name: Report unit coverage
        run: pnpm run test:coverage
        env:
          TZ: UTC
      - name: Build without production credentials
        run: pnpm build
        env:
          POSTGRES_URL: postgres://ci:ci@127.0.0.1:5432/ci
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
          AUTH_SECRET: ci-placeholder-not-for-production
